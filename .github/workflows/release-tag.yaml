name: Release Tag

on:
  push:
    branches:
    - master

permissions:
  contents: write
  packages: write
   
jobs:
  get-version:
    name: Get version from VERSION file
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.version_tag  }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0    # fetch all history

      - name: Set VERSION from latest tag + PR title
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Latest semver tag already merged into the base branch
          LATEST=$(git tag --merged "origin/${REF_NAME}" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          LATEST=${LATEST:-v0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          TITLE=$(git log -1 --pretty=%s)

          if echo "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif echo "$TITLE" | grep -qE '^feat(\(|:)'; then
            MINOR=$((MINOR+1)); PATCH=0
          elif echo "$TITLE" | grep -qE '^(fix|deps|chore|ci|build|docs|style|test|refactor)(\(|:)'; then
            PATCH=$((PATCH+1))
          fi
          # otherwise: no release, keep the latest tag's version

          NEW="${MAJOR}.${MINOR}.${PATCH}"
          CURRENT=$(cat VERSION 2>/dev/null | tr -d '[:space:]' || true)

          echo "Latest tag: $LATEST | PR title: $TITLE | VERSION: ${CURRENT:-<none>} -> $NEW"

          if [ "$NEW" = "$CURRENT" ]; then
            echo "VERSION already $NEW, nothing to do"
          else
            echo "Updating VERSION to $NEW"
            echo "$NEW" > VERSION
          fi

  tag:
    name: Create ${{ needs.get-version.outputs.VERSION }} tag
    runs-on: ubuntu-latest
    needs:
      - get-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Set commit info
        run: |
          git config user.email "ci@github.com"
          git config user.name "Tag-Releaser"
          
      - name: Tag repository
        run: |
          git tag -a ${{ needs.get-version.outputs.VERSION }} -m "Automated build tag"
          git push --tags
          sleep 5s

  release:
    name: Create ${{ needs.get-version.outputs.VERSION }} release
    runs-on: ubuntu-latest
    needs:
      - get-version
      - tag
    continue-on-error: true

    steps:
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 #v3.0.2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.get-version.outputs.VERSION }}
          prerelease: false